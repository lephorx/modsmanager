<!doctype html>
<html lang="en" data-design="modern">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mods Manager</title>
    <script>
      // Tessera's boot logic: apply the look before the first paint so it never flashes.
      (function () {
        var d = localStorage.getItem("mm-design") === "classic" ? "classic" : "modern";
        var root = document.documentElement;
        var media = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          var dark = d === "classic" || media.matches;
          root.dataset.design = d;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        }
        apply();
        media.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
